<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a1615">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus treinos">
<title>Meus treinos | Andressa Pigoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Jost:wght@300;400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1615;--ink2:#262120;--nude:#e8c9b0;--nude2:#d9ad8f;--cream:#f4eee6;--paper:#faf7f2;--muted:#6f6560;--line:#ddd3c8;--ok:#3d7a4f;--red:#a33;
--serif:'Libre Baskerville',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--script:'Caveat',cursive;
--tab:64px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100%;overscroll-behavior-y:none}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--nude2);outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- entrada ---------- */
.login{min-height:100dvh;background:radial-gradient(ellipse at 85% 10%,#4a3a33 0,transparent 55%),var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(32px + var(--st)) 24px calc(32px + var(--sb))}
.lg-in{width:100%;max-width:380px}
.mark{display:inline-block;font-family:var(--serif);font-size:1.5rem;line-height:1.3;color:var(--nude);border:1px solid var(--nude);padding:0 10px}
.lg-in .script{display:block;font-family:var(--script);font-size:2.8rem;line-height:1.05;color:var(--nude);margin:28px 0 8px}
.lg-in p.sub{color:rgba(255,255,255,.75);font-weight:300;margin-bottom:26px}
.lg-in input{width:100%;height:60px;border-radius:999px;border:1px solid rgba(232,201,176,.4);background:rgba(255,255,255,.06);color:#fff;text-align:center;font:500 1.5rem var(--sans);letter-spacing:.18em;text-transform:uppercase}
.lg-in input::placeholder{color:rgba(255,255,255,.3)}
.lg-in input:focus{outline:2px solid var(--nude);outline-offset:2px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border:0;border-radius:999px;background:var(--nude);color:var(--ink);font-weight:500;font-size:1rem;letter-spacing:.04em;margin-top:12px;transition:transform .15s,background .2s}
.big:active{transform:scale(.98)}
.big:disabled{opacity:.6}
.big.dk{background:var(--ink);color:var(--nude)}
.lg-err{min-height:1.5em;margin-top:12px;color:#ffb4a8;font-size:.9rem;text-align:center}
.lg-hint{margin-top:18px;text-align:center;font-size:.9rem;color:rgba(255,255,255,.75)}
.lg-hint a{text-decoration:underline}
.lg-back{display:block;margin-top:34px;text-align:center;font-size:.85rem;color:rgba(255,255,255,.55);text-decoration:none}

/* ---------- app ---------- */
.shell{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;box-shadow:0 0 60px rgba(26,22,21,.1)}
.view{animation:vin .3s both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.body{padding:22px 20px calc(var(--tab) + var(--sb) + 32px)}
.hd{background:var(--ink);color:#fff;padding:calc(16px + var(--st)) 22px 24px;border-radius:0 0 28px 28px}
.hd-top{display:flex;justify-content:space-between;align-items:center}
.hd .mark{font-size:1.2rem}
.av{position:relative;width:46px;height:46px;border-radius:50%;background:var(--nude);color:var(--ink);display:grid;place-items:center;overflow:hidden;font-family:var(--serif);font-size:1.2rem;border:2px solid rgba(255,255,255,.25);padding:0}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hi{font-family:var(--script);font-size:2.5rem;line-height:1.05;color:var(--nude);margin:20px 0 0}
.dt{color:rgba(255,255,255,.7);font-size:.92rem}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:20px}
.wk div{text-align:center;font-size:.74rem;color:rgba(255,255,255,.6)}
.wk b{display:grid;place-items:center;width:38px;height:38px;margin:4px auto 0;border-radius:50%;font-weight:500;font-size:.92rem;color:#fff;border:1px solid rgba(255,255,255,.16)}
.wk .on b{background:var(--nude);color:var(--ink);border-color:var(--nude)}
.wk .td b{border-color:var(--nude);box-shadow:0 0 0 3px rgba(232,201,176,.22)}
.wk-sum{margin-top:14px;font-size:.9rem;color:rgba(255,255,255,.78)}
.lbl{font-family:var(--serif);font-size:1.15rem;margin:0 0 12px}
.next{background:var(--nude);border-radius:24px;padding:24px;box-shadow:0 16px 36px rgba(217,173,143,.38);margin-bottom:30px}
.next .tag{font-size:.85rem;color:#6b5546;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.next h2{font-family:var(--serif);font-weight:400;font-size:1.8rem;line-height:1.2}
.next .f{color:#5a4a42;margin-top:2px}
.next .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 22px;font-size:.92rem}
.next .meta span{display:flex;align-items:center;gap:6px}
.next .meta svg{width:18px;height:18px}
.next .big{margin:0}
.pbar{height:6px;border-radius:99px;background:rgba(26,22,21,.15);overflow:hidden;margin:-8px 0 20px}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.today-ok{display:flex;align-items:center;gap:10px;background:#eef5ef;color:var(--ok);border-radius:16px;padding:12px 16px;font-size:.92rem;margin-bottom:18px}
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-height:68px}
.row:active{background:var(--cream)}
.row .ltr{width:42px;height:42px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-family:var(--serif);font-size:1.05rem;flex:none}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-family:var(--serif);font-weight:400;font-size:1.02rem}
.row small{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row svg{color:var(--nude2)}
.empty{background:var(--cream);border-radius:20px;padding:28px 22px;text-align:center;color:var(--muted)}
.empty .script{display:block;font-family:var(--script);font-size:1.7rem;color:var(--ink);margin-bottom:6px}

.pg-h{padding:calc(24px + var(--st)) 20px 0}
.pg-h h1{font-family:var(--serif);font-weight:400;font-size:1.7rem}
.pg-h p{color:var(--muted);margin-top:4px;font-size:.95rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.tile b{display:block;font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.1}
.tile small{color:var(--muted);font-size:.8rem}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.ev .nm{font-family:var(--serif);font-size:1rem;grid-column:1/-1;margin-bottom:4px}
.ev .kg{font-family:var(--serif);font-size:1.8rem;line-height:1.1}
.ev .dl{font-size:.85rem;color:var(--muted)}
.ev .dl.up{color:var(--ok);font-weight:500}
.ev .hs{grid-column:1/-1;font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:300}
.ev svg.sp{width:132px;height:44px;fill:none;stroke:var(--nude2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sec{font-family:var(--serif);font-weight:400;font-size:1.05rem;margin:22px 0 10px;color:var(--ink)}
.sess{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.sess:last-child{border:0}
.sess small{color:var(--muted)}

.pf-top{display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(28px + var(--st)) 20px 6px}
.pf-av{position:relative;width:112px;height:112px;border-radius:50%;background:var(--nude);display:grid;place-items:center;overflow:hidden;font-family:var(--serif);font-size:2.6rem;border:4px solid #fff;box-shadow:0 8px 24px rgba(26,22,21,.18);padding:0}
.pf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pf-av span.cam{position:absolute;left:0;right:0;bottom:0;background:rgba(26,22,21,.62);color:#fff;font-size:.72rem;padding:5px 0}
.pf-top h1{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin-top:14px}
.chip{display:inline-block;background:var(--ink);color:var(--nude);border-radius:999px;padding:3px 14px;font-family:var(--serif);letter-spacing:.1em;font-size:.88rem;margin-top:6px}
.fl{display:grid;gap:12px}
.fl2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl label{font-size:.85rem;color:var(--muted);display:block}
.fl input,.fl textarea{width:100%;margin-top:4px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-size:1rem;color:var(--ink)}
.fl textarea{resize:vertical;min-height:84px}
.pf-msg{min-height:1.4em;text-align:center;font-size:.9rem;color:var(--ok);margin-top:8px}
.tip{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.tip svg{color:var(--nude2);margin-top:2px}
.lk{display:block;width:100%;text-align:center;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem;padding:12px}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:999px;background:#25d366;color:#fff;text-decoration:none;font-weight:500}
.wa svg{width:22px;height:22px;fill:#fff;stroke:none}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:40;background:var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + var(--sb));border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(26,22,21,.18)}
.tab{background:none;border:0;color:rgba(255,255,255,.55);display:grid;gap:1px;justify-items:center;align-content:center;min-height:52px;font-size:.76rem;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--nude)}
.tab.on::before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--nude)}

/* ---------- treino em andamento ---------- */
.session{position:fixed;inset:0;z-index:80;background:var(--cream)}
.s-in{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--paper)}
.s-top{background:var(--ink);color:#fff;padding:calc(10px + var(--st)) 14px 14px;border-radius:0 0 22px 22px}
.s-bar{display:flex;align-items:center;gap:6px}
.s-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none}
.s-bar .tt{flex:1;min-width:0;padding-left:6px}
.s-bar h2{font-family:var(--serif);font-weight:400;font-size:1.2rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-bar small{color:var(--nude);font-size:.82rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-prog{display:flex;align-items:center;gap:12px;margin:12px 6px 0;font-size:.85rem;color:rgba(255,255,255,.8)}
.s-prog div{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.s-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--nude2),var(--nude));transition:width .35s;border-radius:99px}
.s-list{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.ex{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;transition:border-color .3s,background .3s;scroll-margin-top:12px}
.ex.done{border-color:#b9d4c0;background:#f6faf7}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.num{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--nude);display:grid;place-items:center;font-family:var(--serif);font-size:.92rem;flex:none;transition:background .3s}
.done .num{background:var(--ok);color:#fff}
.ex h3{font-family:var(--serif);font-weight:400;font-size:1.1rem;line-height:1.3}
.ex .rx{color:var(--muted);font-size:.9rem;margin-top:2px}
.ex .ob{margin-top:12px;background:var(--cream);border-radius:12px;padding:10px 12px;font-size:.88rem;color:#5a4a42;display:flex;gap:8px}
.ex .ob svg{width:18px;height:18px;margin-top:2px;color:var(--nude2)}
.vid{display:inline-flex;align-items:center;gap:8px;margin-top:12px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--nude2);background:var(--cream);font-size:.88rem;text-decoration:none}
.vid svg{width:16px;height:16px;fill:currentColor;stroke:none}
.sets{display:flex;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
.set{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--nude2);background:var(--cream);display:grid;place-items:center;font-family:var(--serif);font-size:1.15rem;transition:transform .15s,background .2s,color .2s}
.set:active{transform:scale(.9)}
.set[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--nude);animation:pop .25s}
@keyframes pop{50%{transform:scale(1.12)}}
.sets-h{font-size:.82rem;color:var(--muted);margin-top:4px}
.ld{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.ld>span{flex:1;font-size:.92rem;color:var(--muted)}
.sb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.sb:active{background:var(--cream)}
.ld input{width:82px;height:46px;text-align:center;border:1px solid var(--line);border-radius:14px;font:500 1.15rem var(--sans);color:var(--ink);background:#fff}
.ld-h{font-size:.82rem;color:var(--muted);margin-top:8px;min-height:1.2em}
.reset{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.88rem;padding:10px}
.s-foot{background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--sb))}
.rest{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--nude);border-radius:20px;padding:10px 12px 10px 14px;margin-bottom:10px}
.rest.ready{background:var(--ok);color:#fff}
.ring{width:50px;height:50px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:rgba(255,255,255,.18)}
.ring .fg{stroke:var(--nude);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest.ready .ring .fg{stroke:#fff}
.rest .tm{flex:1;min-width:0}
.rest .t{font-family:var(--serif);font-size:1.6rem;color:#fff;line-height:1}
.rest small{display:block;color:rgba(255,255,255,.7);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rest button{min-height:42px;border-radius:999px;border:1px solid rgba(232,201,176,.5);background:transparent;color:var(--nude);padding:0 14px;font-size:.88rem}
.rest.ready button{border-color:rgba(255,255,255,.6);color:#fff}
.s-foot .big{margin:0}
.s-foot .big:disabled{background:#eef5ef;color:var(--ok);opacity:1}
.fin-sc{position:absolute;inset:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px calc(32px + var(--sb));max-width:560px;margin:0 auto}
.fin-sc .ck{width:92px;height:92px;border-radius:50%;background:var(--nude);color:var(--ink);display:grid;place-items:center;animation:pop .6s both}
.fin-sc .ck svg{width:46px;height:46px;stroke-width:2.2}
.fin-sc .script{font-family:var(--script);font-size:2.8rem;line-height:1.05;color:var(--nude);margin:22px 0 6px}
.fin-sc p{color:rgba(255,255,255,.75);font-weight:300}
.fin-st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:28px 0 8px}
.fin-st div{border:1px solid rgba(232,201,176,.3);border-radius:18px;padding:14px 6px}
.fin-st b{display:block;font-family:var(--serif);font-weight:400;font-size:1.8rem;color:var(--nude)}
.fin-st small{font-size:.8rem;color:rgba(255,255,255,.7)}
.fin-sc .big{max-width:360px}

.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 22px);transform:translate(-50%,20px);background:var(--ink);color:var(--nude);padding:12px 22px;border-radius:999px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.up{bottom:calc(var(--sb) + 110px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:360px){.set{width:50px;height:50px}.hi{font-size:2.1rem}.ev svg.sp{width:100px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<!-- entrada -->
<div class="login" id="login">
<div class="lg-in">
<span class="mark">AP</span>
<span class="script">Área do aluno</span>
<p class="sub">Seus treinos, cargas e evolução, direto no celular. Digite o código que a Andressa te enviou.</p>
<input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" aria-label="Código de acesso">

/* ---------- treino em andamento ---------- */

function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}

return pv?"Última vez: "+pv.kg+" kg ("+dt(pv.d)+")":"Ainda sem carga registrada."}
function openSession(ti){
var w=al.treinos[ti];if(!w)return;
S={ti:ti,w:w,done:getDone(ti),start:+st(skey(ti))||0,fin:!!st(fkey(ti)),refs:[],timers:{}};

function buildSession(){

var top=h("div",{class:"s-top"},[
h("div",{class:"s-bar"},[x,h("div",{class:"tt"},[h("h2",{text:w.n}),w.f?h("small",{text:w.f}):null])]),
h("div",{class:"s-prog"},[h("div",null,bar),prog])]);

w.ex.forEach(function(e,i){list.appendChild(buildEx(e,i))});

function buildEx(e,i){

var chips=[];
for(var j=0;j<n;j++)(function(j){var b=h("button",{class:"set",type:"button","aria-pressed":"false","aria-label":"Série "+(j+1)+" de "+n,onclick:function(){tapSet(i,j)}});chips.push(b)})(j);
var inp=h("input",{type:"number",step:"0.5",min:"0",inputmode:"decimal",placeholder:"kg","aria-label":"Carga em kg: "+e.nm});
var hint=h("div",{class:"ld-h"});
var hs=al.cargas[k]||[];
inp.value=hs.length?hs[hs.length-1].kg:"";hint.textContent=hintText(k);
inp.onchange=function(){commitLoad(i)};
function bump(dir){var v=num(inp.value)||0,step=v<10?1:2.5;v=Math.max(0,r1(v+dir*step));inp.value=v;clearTimeout(S.timers[i]);S.timers[i]=setTimeout(function(){commitLoad(i)},700)}
var card=h("article",{class:"ex"},[
h("div",{class:"ex-h"},[h("span",{class:"num",text:i+1}),h("div",null,[h("h3",{text:e.nm}),h("div",{class:"rx",text:n+" séries × "+e.r+(restOf(e)?" · descanso "+restOf(e)+"s":"")})])]),
e.o?h("div",{class:"ob"},[ic("info"),h("span",{text:e.o})]):null,
(e.v&&/^https?:\/\//i.test(e.v))?h("a",{class:"vid",href:e.v,target:"_blank",rel:"noopener"},[ic("play"),"Ver execução"]):null,
h("div",{class:"sets",role:"group","aria-label":"Séries"},chips),
h("div",{class:"sets-h",id:"sh"+i}),

h("button",{class:"sb",type:"button","aria-label":"Diminuir carga",onclick:function(){bump(-1)}},ic("minus")),inp,

S.refs[i]=r;return card}

}

c=(j<c)?j:j+1;

else if(c>=r.n){stopRest();var nx=S.refs[i+1];if(nx)setTimeout(function(){nx.card.scrollIntoView({behavior:"smooth",block:"start"})},350)}
}else if(c===0){}}

if(v===null||v<0)return;

/* descanso */
function startRest(sec,label){

var C=2*Math.PI*21,box=S.restBox;box.className="rest";box.hidden=false;box.innerHTML="";
var ring=document.createElementNS(NS,"svg");ring.setAttribute("class","ring");ring.setAttribute("viewBox","0 0 50 50");

var f=document.createElementNS(NS,"circle");f.setAttribute("class","fg");f.setAttribute("cx","25");f.setAttribute("cy","25");f.setAttribute("r","21");f.style.strokeDasharray=C;f.style.strokeDashoffset=0;
ring.appendChild(bg);ring.appendChild(f);
var t=h("div",{class:"t"}),sm=h("small",{text:"Descanso · "+label});
box.appendChild(ring);box.appendChild(h("div",{class:"tm"},[t,sm]));
box.appendChild(h("button",{type:"button",text:"+15 s",onclick:function(){if(R){R.end+=15000;R.total+=15;tick()}}}));

R.f=f;R.t=t;R.sm=sm;R.C=C;
tick();rt=setInterval(tick,250)}
function tick(){
if(!R)return;
var left=Math.ceil((R.end-Date.now())/1000);
if(left<=0){endRest();return}
R.t.textContent=Math.floor(left/60)+":"+("0"+left%60).slice(-2);
R.f.style.strokeDashoffset=R.C*(1-left/R.total)}
function endRest(){
clearInterval(rt);rt=null;
if(!R)return;
S.restBox.classList.add("ready");R.t.textContent="Pronto!";R.sm.textContent="Próxima série";
beep();if(navigator.vibrate)navigator.vibrate([250,100,250]);
R=null;clearTimeout(rh);rh=setTimeout(function(){if(S&&!R){S.restBox.hidden=true}},5000)}
function stopRest(){clearInterval(rt);rt=null;R=null;clearTimeout(rh);if(S&&S.restBox)S.restBox.hidden=true}
function resetSession(){
if(!confirm("Zerar as séries marcadas deste treino hoje?"))return;
S.done={};S.start=0;S.fin=false;setDone(S.ti,{});st(skey(S.ti),null);st(fkey(S.ti),null);stopRest();
S.w.ex.forEach(function(e,i){paint(i)});updateProg()}

/* concluir */
function finish(){
if(S.fin)return;
var sets=0,exs=0;
S.w.ex.forEach(function(e,i){var n=S.refs[i].n,c=Math.min(S.done[i]||0,n);sets+=c;if(c>=n)exs++});
if(!sets){toast("Marque ao menos uma série para concluir.",true);return}
if(exs<S.w.ex.length&&!confirm("Ainda faltam exercícios. Concluir mesmo assim?"))return;
var m=S.start?Math.max(1,Math.round((Date.now()-S.start)/60000)):null;
var p=al.perfil;p.sessoes=p.sessoes||[];
p.sessoes.push({d:today(),t:S.ti,n:S.w.n,s:sets,e:exs,m:m});
if(p.sessoes.length>200)p.sessoes=p.sessoes.slice(-200);
cache();st(fkey(S.ti),"1");S.fin=true;stopRest();
